# Gradle JVM
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# configureondemand is only beneficial in multi-project builds; omitted here
# to avoid build-cache misses in this single-module project.

# AndroidX
android.useAndroidX=true

# Non-transitive R class — each module only sees its own resources, preventing
# accidental use of transitive resource IDs and speeding up incremental builds.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Compose — Jetifier is not needed; all dependencies are already AndroidX-native.
android.enableJetifier=false

# NDK
android.ndkVersion=27.2.12479018

# R8 full mode — enables more aggressive dead-code elimination for release builds.
android.enableR8.fullMode=true

# Suppress the "Configuration cache" experimental warning in Gradle 9.x.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
